<div class="table">
    <p-table [value]="brands" class="table" [tableStyle]="{'min-width': '50rem'}">
        <ng-template pTemplate="caption">
            <div class="flex align-items-center justify-content-between">
                <app-form-brand [brand]="selectedBrand" (brandCreated)="brandCreated($event)"></app-form-brand>

            </div>
        </ng-template>
        <ng-template pTemplate="header">
            <tr>
                <th>Nombre</th>
                <th>Comentario</th>
                <th id="cabecera"></th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-brand>
            <tr>
                <td>{{ brand.name }}</td>
                <td>{{ brand.comment }}</td>
                <td id="botones">
                    <p-button (click)="updateBrand(brand)" class="editButton" icon="pi pi-pencil" [style]="{'background-color': ' #61ca36', 'border-color':' #61ca36'}" ></p-button>
                    <p-button (click)="deleteBrand(brand)" icon="pi pi-trash" class="deleteButton" [style]="{'background-color': 'red', 'border-color':'red'}"></p-button>
                </td>
            </tr>
        </ng-template>
    </p-table>
</div>
